<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="产能预测">
    <title>预计维修数量工具 V1.0</title>
    <style>
        /* --- 全局样式重置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        hr {
            border: none;
            border-top: 1px solid #d3d3d3;
            margin: 20px 0;
        }
        
        /* --- 标签与输入框样式 --- */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #154A7F;
            margin-top: 20px;
            margin-bottom: 8px;
        }
        .section-subtitle {
            font-size: 12px;
            color: #888888;
            font-weight: normal;
        }
        
        input {
            width: 100%;
            box-sizing: border-box;
            font-size: 16px; 
            padding: 12px;
            border: 1px solid #cccccc !important;
            border-radius: 8px;
            background-color: #ffffff !important;
            box-shadow: none !important;
            appearance: none; 
            -webkit-appearance: none;
            transition: all 0.2s ease;
            outline: none !important;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* --- 核心魔法：状态验证 --- */
        .status-focus {
            border: 1px solid #FF3B30 !important;
            box-shadow: 0 0 0 1px #FF3B30 !important;
            background-color: #FFF1F0 !important;
        }
        .status-valid {
            border: 1px solid #4CAF50 !important;
            box-shadow: 0 0 0 1px #4CAF50 !important;
            background-color: #F4FBF4 !important;
        }
        .status-error {
            border: 1px solid #FF3B30 !important;
            box-shadow: 0 0 0 1px #FF3B30 !important;
            background-color: #FFF1F0 !important;
        }

        /* --- 按钮样式 --- */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            width: 200px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #888888;
            font-weight: bold;
            font-size: 16px;
            height: 45px;
            border: 1px solid #dddddd;
        }
        
        .btn-predict {
            background-color: #E8E2F8; 
            color: #4A3082;
            font-weight: 900;
            font-size: 20px;
            height: 55px;
            width: 100%; 
            margin-top: 25px;
            border-radius: 8px;
            border: 1px solid #D1C4E9;
            box-shadow: 0 4px 6px rgba(74, 48, 130, 0.1);
        }
        .btn-predict:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px rgba(74, 48, 130, 0.1);
        }

        /* --- 新增：吸顶悬浮胶囊 --- */
        .floating-bar {
            display: none;
            position: sticky;
            top: 10px; /* 距离顶部一点点距离 */
            z-index: 1000;
            background: rgba(232, 226, 248, 0.95); /* 半透明紫色 */
            backdrop-filter: blur(10px); /* 苹果经典的毛玻璃效果 */
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(209, 196, 233, 0.8);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(74, 48, 130, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .floating-bar:active {
            transform: scale(0.98);
        }
        .float-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #4A3082;
            font-weight: bold;
            font-size: 15px;
        }
        .float-number {
            font-size: 22px;
            font-weight: 900;
            color: #6200EE;
            display: inline-block;
        }

        /* --- 预测结果卡片 --- */
        .prediction-card {
            display: none;
            background: linear-gradient(135deg, #F4F0FF 0%, #E8E2F8 100%);
            border: 1px solid #D1C4E9;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            color: #4A3082;
            box-shadow: 0 4px 12px rgba(74, 48, 130, 0.08);
        }
        .pred-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .live-badge {
            font-size: 12px;
            background-color: #4CAF50;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .pred-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .pred-highlight {
            display: inline-block;
            font-size: 18px;
            font-weight: 900;
            color: #6200EE;
        }
        .pred-note {
            font-size: 12px;
            color: #7E6BC4;
            margin-top: 10px;
            text-align: right;
        }

        /* --- 数据更新时的弹跳动画 --- */
        @keyframes popUpdate {
            0% { transform: scale(1); }
            40% { transform: scale(1.4); } 
            100% { transform: scale(1); }
        }
        .update-flash {
            animation: popUpdate 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>预计维修数量工具 V1.0</h1>
    <hr style="margin-top: -5px;">

    <!-- 新增：吸顶悬浮胶囊 -->
    <div id="floating-bar" class="floating-bar" onclick="scrollToCard()">
        <div class="float-content">
            <span style="display: flex; align-items: center;">
                <span class="live-badge" style="margin-right: 10px; font-size: 10px;">LIVE</span>
                ✨ 还可以接新单：
            </span>
            <span><span id="float-can-accept" class="float-number">0</span> 台</span>
        </div>
    </div>

    <div class="section-title">关店时间 <span class="section-subtitle">(支持半小时，如 22.5)</span></div>
    <input type="time" id="close_time" class="input-field status-valid" value="22:00">

    <div class="section-title">单台维修耗时 <span class="section-subtitle">(分钟/台)</span></div>
    <input type="number" id="efficiency" class="input-field status-valid" value="40" placeholder="例如: 40" enterkeyhint="next">

    <div class="section-title">维修工时排班 <span class="section-subtitle">(随时可加减修改)</span></div>
    <div id="hours-container">
        <!-- JS 自动生成 -->
    </div>

    <div class="section-title">当前等待维修数量 <span class="section-subtitle">(积压排队的设备数)</span></div>
    <input type="number" id="wait_qty" class="input-field" placeholder="请输入等待数量" enterkeyhint="next">

    <div class="section-title">当前正在维修数量 <span class="section-subtitle">(操作台上的设备数)</span></div>
    <input type="number" id="repairing_qty" class="input-field" placeholder="请输入正在维修数量" enterkeyhint="done">

    <button class="btn-predict" onclick="activateDashboard()">计算</button>
    
    <div id="prediction-card" class="prediction-card">
        <div class="pred-title">
            <span>⏱️ 实时产能看板</span>
            <span class="live-badge">LIVE 实时更新中</span>
        </div>
        <div class="pred-data-row">
            <span>从 <strong id="pred-time-start">16:00</strong> 到 <strong id="pred-time-end">22:00</strong> 剩余工时：</span>
            <span><span id="pred-hours" class="pred-highlight">0</span> h</span>
        </div>
        <div class="pred-data-row">
            <span>剩余工时总产能：</span>
            <span><span id="pred-total-capacity" class="pred-highlight">0</span> 台</span>
        </div>
        <div class="pred-data-row">
            <span>减去当前等待维修：</span>
            <span><span id="pred-waiting" class="pred-highlight" style="color: #FF3B30;">0</span> 台</span>
        </div>
        <div class="pred-data-row">
            <span>减去当前正在维修：</span>
            <span><span id="pred-repairing" class="pred-highlight" style="color: #FF3B30;">0</span> 台</span>
        </div>
        <hr style="border-top: 1px dashed #D1C4E9; margin: 12px 0;">
        <div class="pred-data-row" style="font-size: 18px; font-weight: bold;">
            <span>✨ 还可以接入新单：</span>
            <span><span id="pred-can-accept" class="pred-highlight" style="font-size: 24px;">0</span> 台</span>
        </div>
        <div class="pred-note" id="pred-warning">* 按单台耗时 40 分钟计算</div>
    </div>
    
    <div class="btn-container" style="margin-top: 30px;">
        <button class="btn-secondary" onclick="clearData()">刷新页面重置</button>
    </div>
</div>

<script>
    const hoursContainer = document.getElementById('hours-container');
    for (let i = 10; i <= 22; i++) {
        let input = document.createElement('input');
        input.type = 'number';
        input.id = 'h' + i;
        input.className = 'input-field';
        input.setAttribute('enterkeyhint', 'next');
        input.placeholder = i + ':00';
        input.style.marginBottom = '10px';
        hoursContainer.appendChild(input);
    }

    let isDashboardActive = false;

    function checkInputStatus(el) {
        let val = el.value.trim();
        el.classList.remove('status-focus', 'status-valid', 'status-error');
        if (val === '') {
            if (document.activeElement === el) el.classList.add('status-focus');
            return;
        }
        
        let isValid = false;
        if (el.type === 'time') {
            isValid = /^[\d:]+$/.test(val); 
        } else {
            isValid = /^\d*\.?\d+$/.test(val); 
        }

        if (isValid) el.classList.add('status-valid');
        else el.classList.add('status-error');
    }

    const allInputs = document.querySelectorAll('.input-field');
    allInputs.forEach((input, index) => {
        input.addEventListener('input', () => {
            checkInputStatus(input);
            if (isDashboardActive) {
                updateDashboard(true); 
            }
        });
        
        input.addEventListener('focus', () => checkInputStatus(input));
        input.addEventListener('blur', () => checkInputStatus(input));

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (this.tagName === 'INPUT') {
                    e.preventDefault(); 
                    if (index < allInputs.length - 1) allInputs[index + 1].focus(); 
                    else this.blur(); 
                }
            }
        });
    });

    function activateDashboard() {
        updateDashboard(false); 
    }

    // 点击悬浮窗，自动滑到底部大看板
    function scrollToCard() {
        let card = document.getElementById('prediction-card');
        if (card.style.display === 'block') {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function updateDashboard(isSilentMode) {
        let closeTimeStr = document.getElementById('close_time').value;
        if (!closeTimeStr) {
            if (!isSilentMode) {
                alert("请先在最上方选择关店时间！");
                document.getElementById('close_time').focus();
            }
            return;
        }

        let timeParts = closeTimeStr.split(':');
        let closeHour = parseInt(timeParts[0], 10) + parseInt(timeParts[1], 10) / 60;

        let effStr = document.getElementById('efficiency').value.trim();
        let minsPerDevice = parseFloat(effStr);
        if (isNaN(minsPerDevice) || minsPerDevice <= 0) {
            if (!isSilentMode) {
                alert("请填写正确的单台维修耗时 (必须大于0的数字)！");
                document.getElementById('efficiency').focus();
            }
            return;
        }

        let currentHour = new Date().getHours();
        let startHour = currentHour < 10 ? 10 : currentHour;
        
        let remainingHours = 0;
        
        if (startHour < closeHour) {
            let maxBoxHour = Math.floor(closeHour);
            if (maxBoxHour > 22) maxBoxHour = 22; 
            
            for (let i = startHour; i <= maxBoxHour; i++) {
                let inputEl = document.getElementById('h' + i);
                if (inputEl) {
                    let valStr = inputEl.value.trim();
                    if (/^\d*\.?\d+$/.test(valStr)) {
                        remainingHours += parseFloat(valStr);
                    }
                }
            }
        }

        let waitQty = parseInt(document.getElementById('wait_qty').value.trim(), 10) || 0;
        let repairingQty = parseInt(document.getElementById('repairing_qty').value.trim(), 10) || 0;

        let totalCapacity = Math.floor(remainingHours / (minsPerDevice / 60));
        let canAccept = totalCapacity - waitQty - repairingQty;

        let closeHourDisplay = Math.floor(closeHour);
        let closeMinDisplay = (closeHour % 1 === 0.5) ? "30" : "00";

        document.getElementById('pred-time-start').innerText = startHour + ":00";
        document.getElementById('pred-time-end').innerText = closeTimeStr; 
        document.getElementById('pred-hours').innerText = remainingHours.toFixed(1);
        document.getElementById('pred-total-capacity').innerText = totalCapacity;
        document.getElementById('pred-waiting').innerText = waitQty;
        document.getElementById('pred-repairing').innerText = repairingQty;

        let acceptEl = document.getElementById('pred-can-accept');
        let floatAcceptEl = document.getElementById('float-can-accept'); // 悬浮窗数字
        let warningEl = document.getElementById('pred-warning');

        if (canAccept < 0) {
            acceptEl.innerText = "0";
            acceptEl.style.color = "#FF3B30"; 
            floatAcceptEl.innerText = "0";
            floatAcceptEl.style.color = "#FF3B30"; 
            warningEl.innerText = `⚠️ 警告：当前任务已超出剩余产能 ${Math.abs(canAccept)} 台！`;
            warningEl.style.color = "#FF3B30";
        } else {
            acceptEl.innerText = canAccept;
            acceptEl.style.color = "#6200EE"; 
            floatAcceptEl.innerText = canAccept;
            floatAcceptEl.style.color = "#6200EE"; 
            warningEl.innerText = `* 按单台耗时 ${minsPerDevice} 分钟计算`;
            warningEl.style.color = "#7E6BC4";
        }

        // 触发数字弹跳动画 (大看板 + 悬浮窗)
        if (isDashboardActive && isSilentMode) {
            let flashIds = ['pred-hours', 'pred-total-capacity', 'pred-waiting', 'pred-repairing', 'pred-can-accept', 'float-can-accept'];
            flashIds.forEach(id => {
                let el = document.getElementById(id);
                if (el) {
                    el.classList.remove('update-flash');
                    void el.offsetWidth; 
                    el.classList.add('update-flash');
                }
            });
        }

        if (!isDashboardActive) {
            let card = document.getElementById('prediction-card');
            let floatBar = document.getElementById('floating-bar');
            
            card.style.display = 'block';
            floatBar.style.display = 'block'; // 显示悬浮窗
            isDashboardActive = true;
            
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }
    }

    function clearData() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
            const allInputs = document.querySelectorAll('.input-field');
            allInputs.forEach(input => {
                if (input.id !== 'efficiency' && input.id !== 'close_time') {
                    input.value = '';
                    checkInputStatus(input); 
                }
            });
            document.getElementById('prediction-card').style.display = 'none';
            document.getElementById('floating-bar').style.display = 'none'; // 隐藏悬浮窗
            isDashboardActive = false; 
        }, 300); 
    }
</script>

</body>
</html>
