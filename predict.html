<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="产能预测">
    <title>预计维修数量工具 V1.0</title>
    <style>
        /* --- 全局样式重置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        hr {
            border: none;
            border-top: 1px solid #d3d3d3;
            margin: 20px 0;
        }
        
        /* --- 标签与输入框样式 --- */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #154A7F;
            margin-top: 20px;
            margin-bottom: 8px;
        }
        .section-subtitle {
            font-size: 12px;
            color: #888888;
            font-weight: normal;
        }
        
        input {
            width: 100%;
            box-sizing: border-box;
            font-size: 16px; 
            padding: 12px;
            border: 1px solid #cccccc !important;
            border-radius: 8px;
            background-color: #ffffff !important;
            box-shadow: none !important;
            appearance: none; 
            -webkit-appearance: none;
            transition: all 0.2s ease;
            outline: none !important;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* --- 核心魔法：状态验证 --- */
        .status-focus {
            border: 1px solid #FF3B30 !important;
            box-shadow: 0 0 0 1px #FF3B30 !important;
            background-color: #FFF1F0 !important;
        }
        .status-valid {
            border: 1px solid #4CAF50 !important;
            box-shadow: 0 0 0 1px #4CAF50 !important;
            background-color: #F4FBF4 !important;
        }
        .status-error {
            border: 1px solid #FF3B30 !important;
            box-shadow: 0 0 0 1px #FF3B30 !important;
            background-color: #FFF1F0 !important;
        }

        /* --- 按钮样式 --- */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            width: 200px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #888888;
            font-weight: bold;
            font-size: 16px;
            height: 45px;
            border: 1px solid #dddddd;
        }
        
        /* --- 预测按钮 --- */
        .btn-predict {
            background-color: #E8E2F8; 
            color: #4A3082;
            font-weight: 900;
            font-size: 20px;
            height: 55px;
            width: 100%; 
            margin-top: 25px;
            border-radius: 8px;
            border: 1px solid #D1C4E9;
            box-shadow: 0 4px 6px rgba(74, 48, 130, 0.1);
        }
        .btn-predict:active {
            transform: scale(0.98);
            box-shadow: 0 2px 4px rgba(74, 48, 130, 0.1);
        }

        /* --- 预测结果卡片 --- */
        .prediction-card {
            display: none;
            background: linear-gradient(135deg, #F4F0FF 0%, #E8E2F8 100%);
            border: 1px solid #D1C4E9;
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            color: #4A3082;
            box-shadow: 0 4px 12px rgba(74, 48, 130, 0.08);
        }
        .pred-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .pred-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .pred-highlight {
            font-size: 18px;
            font-weight: 900;
            color: #6200EE;
        }
        .pred-note {
            font-size: 12px;
            color: #7E6BC4;
            margin-top: 10px;
            text-align: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>预计维修数量工具 V1.0</h1>
    <hr style="margin-top: -5px;">

    <!-- 新增：动态关店时间 -->
    <div class="section-title">关店时间 <span class="section-subtitle">(24小时制数字)</span></div>
    <input type="number" id="close_time" class="input-field" placeholder="例如: 22 代表晚上10点" enterkeyhint="next">

    <div class="section-title">维修工时排班</div>
    <div id="hours-container">
        <!-- JS 自动生成 10 到 22 的输入框，但计算时会根据关店时间截断 -->
    </div>

    <!-- 等待维修数量输入框 -->
    <div class="section-title">当前等待维修数量 <span class="section-subtitle">(目前积压排队的设备数)</span></div>
    <input type="number" id="wait_qty" class="input-field" placeholder="请输入等待数量" enterkeyhint="done">

    <!-- 实时产能预测按钮与卡片 -->
    <button class="btn-predict" onclick="predictCapacity()">📊 计算剩余产能预测</button>
    
    <div id="prediction-card" class="prediction-card">
        <div class="pred-title">⏱️ 实时产能看板</div>
        <div class="pred-data-row">
            <span>从 <strong id="pred-time-start">16:00</strong> 到 <strong id="pred-time-end">22:00</strong> 剩余工时：</span>
            <span><span id="pred-hours" class="pred-highlight">0</span> h</span>
        </div>
        <div class="pred-data-row">
            <span>剩余工时总产能：</span>
            <span><span id="pred-total-capacity" class="pred-highlight">0</span> 台</span>
        </div>
        <div class="pred-data-row">
            <span>减去当前等待维修：</span>
            <span><span id="pred-waiting" class="pred-highlight" style="color: #FF3B30;">0</span> 台</span>
        </div>
        <hr style="border-top: 1px dashed #D1C4E9; margin: 12px 0;">
        <div class="pred-data-row" style="font-size: 18px; font-weight: bold;">
            <span>✨ 还可以接入新单：</span>
            <span><span id="pred-can-accept" class="pred-highlight" style="font-size: 24px;">0</span> 台</span>
        </div>
        <div class="pred-note" id="pred-warning">* 按单台耗时 40 分钟计算</div>
    </div>
    
    <div class="btn-container" style="margin-top: 30px;">
        <button class="btn-secondary" onclick="clearData()">刷新页面</button>
    </div>
</div>

<script>
    // 1. 初始化：生成 10 到 22 的工时输入框
    // 界面上依然显示全天的框，方便随时修改，但底层的计算逻辑会变聪明
    const hoursContainer = document.getElementById('hours-container');
    for (let i = 10; i <= 22; i++) {
        let input = document.createElement('input');
        input.type = 'number';
        input.id = 'h' + i;
        input.className = 'input-field';
        input.setAttribute('enterkeyhint', 'next');
        input.placeholder = i + ':00';
        input.style.marginBottom = '10px';
        hoursContainer.appendChild(input);
    }

    // 2. 状态验证逻辑
    function checkInputStatus(el) {
        let val = el.value.trim();
        el.classList.remove('status-focus', 'status-valid', 'status-error');
        if (val === '') {
            if (document.activeElement === el) el.classList.add('status-focus');
            return;
        }
        let isValid = /^\d*\.?\d+$/.test(val);
        if (isValid) el.classList.add('status-valid');
        else el.classList.add('status-error');
    }

    const allInputs = document.querySelectorAll('.input-field');
    allInputs.forEach((input, index) => {
        input.addEventListener('input', () => checkInputStatus(input));
        input.addEventListener('focus', () => checkInputStatus(input));
        input.addEventListener('blur', () => checkInputStatus(input));

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (this.tagName === 'INPUT') {
                    e.preventDefault(); 
                    if (index < allInputs.length - 1) allInputs[index + 1].focus(); 
                    else this.blur(); 
                }
            }
        });
    });

    // --- 核心逻辑：带动态关店时间的产能预测 ---
    function predictCapacity() {
        // 1. 获取并验证关店时间
        let closeTimeStr = document.getElementById('close_time').value.trim();
        let closeHour = parseInt(closeTimeStr, 10);
        
        if (isNaN(closeHour) || closeHour < 10 || closeHour > 24) {
            alert("请先在最上方填写正确的关店时间 (例如 18 到 22 之间的数字)！");
            document.getElementById('close_time').focus();
            return;
        }

        // 2. 获取当前系统时间
        let currentHour = new Date().getHours();
        
        // 智能修正开始时间
        let startHour = currentHour;
        if (startHour < 10) startHour = 10;
        
        // 防呆：如果当前时间已经超过了你填的关店时间
        if (startHour >= closeHour) {
            alert(`现在已经是 ${startHour}:00，已经超过或等于你设置的关店时间 ${closeHour}:00 啦！今天不能再接单了。`);
            return;
        }

        let remainingHours = 0;
        
        // 3. 核心：只累加从【当前时间】到【你填写的关店时间】的工时
        for (let i = startHour; i <= closeHour; i++) {
            let inputEl = document.getElementById('h' + i);
            // 如果你填的关店时间（比如24点）超出了我们预设的输入框范围，就忽略
            if (inputEl) {
                let valStr = inputEl.value.trim();
                if (/^\d*\.?\d+$/.test(valStr)) {
                    remainingHours += parseFloat(valStr);
                }
            }
        }

        // 4. 获取当前等待维修数量
        let waitQtyStr = document.getElementById('wait_qty').value.trim();
        let waitQty = /^\d*\.?\d+$/.test(waitQtyStr) ? parseInt(waitQtyStr, 10) : 0;

        // 5. 计算逻辑：总产能 = 剩余工时 / (40/60)
        let totalCapacity = Math.floor(remainingHours / (40 / 60));
        
        // 还可以接单 = 总产能 - 等待数量
        let canAccept = totalCapacity - waitQty;

        // 6. 更新 UI
        document.getElementById('pred-time-start').innerText = startHour + ":00";
        document.getElementById('pred-time-end').innerText = closeHour + ":00"; // 显示关店时间
        document.getElementById('pred-hours').innerText = remainingHours.toFixed(1);
        document.getElementById('pred-total-capacity').innerText = totalCapacity;
        document.getElementById('pred-waiting').innerText = waitQty;

        let acceptEl = document.getElementById('pred-can-accept');
        let warningEl = document.getElementById('pred-warning');

        // 超负荷警告逻辑
        if (canAccept < 0) {
            acceptEl.innerText = "0";
            acceptEl.style.color = "#FF3B30"; // 红色
            warningEl.innerText = `⚠️ 警告：当前积压已超出剩余产能 ${Math.abs(canAccept)} 台！`;
            warningEl.style.color = "#FF3B30";
        } else {
            acceptEl.innerText = canAccept;
            acceptEl.style.color = "#6200EE"; // 恢复紫色
            warningEl.innerText = "* 按单台耗时 40 分钟计算";
            warningEl.style.color = "#7E6BC4";
        }

        let card = document.getElementById('prediction-card');
        card.style.display = 'block';

        // 丝滑滚动到结果区
        setTimeout(() => {
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
    }

    // 7. 刷新/清空逻辑
    function clearData() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
            allInputs.forEach(input => {
                input.value = '';
                checkInputStatus(input); 
            });
            document.getElementById('prediction-card').style.display = 'none';
        }, 300); 
    }
</script>

</body>
</html>
