<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="维修报告">
    <title>维修报告生成工具</title>
    <style>
        /* --- 全局样式重置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        hr {
            border: none;
            border-top: 1px solid #d3d3d3;
            margin: 20px 0;
        }
        
        /* --- 标签与输入框样式 --- */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #154A7F;
            margin-top: 20px;
            margin-bottom: 8px;
        }
        
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 16px; 
            padding: 12px;
            border: 1px solid #cccccc !important;
            border-radius: 8px;
            background-color: #ffffff !important;
            box-shadow: none !important;
            appearance: none; 
            -webkit-appearance: none;
            transition: all 0.2s ease;
            outline: none !important;
        }
        textarea {
            height: 120px;
            resize: none;
        }

        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .status-focus { border: 1px solid #FF3B30 !important; box-shadow: 0 0 0 1px #FF3B30 !important; background-color: #FFF1F0 !important; }
        .status-valid { border: 1px solid #4CAF50 !important; box-shadow: 0 0 0 1px #4CAF50 !important; background-color: #F4FBF4 !important; }
        .status-error { border: 1px solid #FF3B30 !important; box-shadow: 0 0 0 1px #FF3B30 !important; background-color: #FFF1F0 !important; }

        .btn-container { display: flex; justify-content: center; margin-top: 20px; }
        button { border: none; border-radius: 8px; cursor: pointer; display: block; width: 200px; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        .btn-primary { background-color: #dcf5d0; color: #000000; font-weight: 900; font-size: 22px; height: 55px; }
        .btn-copy { background-color: #f8cbcc; color: #000000; font-weight: bold; font-size: 18px; height: 50px; }
        .btn-secondary { background-color: #f5f5f5; color: #888888; font-weight: bold; font-size: 16px; height: 45px; border: 1px solid #dddddd; }

        #result-section { display: none; }
        .report-display { font-size: 14px; line-height: 1.6; color: #000000; background-color: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #eeeeee; }
        #hidden-copy-text { position: absolute; left: -9999px; opacity: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>维修报告生成工具 V1.0</h1>
    <hr style="margin-top: -5px;">

    <div class="section-title">截止时间</div>
    <input type="number" id="end_time" class="input-field" placeholder="例如: 22 或者 22:00" enterkeyhint="next">

    <div class="section-title">维修数量</div>
    <input type="number" id="qty" class="input-field" placeholder="请输入数量" enterkeyhint="next">

    <div class="section-title">维修工时</div>
    <div id="hours-container"></div>

    <div class="section-title">其他分享</div>
    <textarea id="notes" class="input-field" placeholder="有什么想分享的吗？"></textarea>

    <div class="btn-container">
        <button class="btn-primary" onclick="generateReport()">生成报告</button>
    </div>
    
    <div class="btn-container" style="margin-top: 15px;">
        <button class="btn-secondary" onclick="clearData()">刷新页面</button>
    </div>

    <div id="result-section">
        <hr>
        <div id="report-output" class="report-display"></div>
        <hr>
        <textarea id="hidden-copy-text" readonly></textarea>
        <div class="btn-container">
            <button id="copy-btn" class="btn-copy" onclick="copyReport()">点击复制报告内容</button>
        </div>
        <div class="btn-container" style="margin-top: 15px;">
            <button class="btn-secondary" onclick="clearData()">刷新页面</button>
        </div>
    </div>
</div>

<script>
    const hoursContainer = document.getElementById('hours-container');
    for (let i = 10; i <= 22; i++) {
        let input = document.createElement('input');
        input.type = 'number';
        input.id = 'h' + i;
        input.className = 'input-field';
        input.setAttribute('enterkeyhint', 'next');
        input.placeholder = i + ':00';
        input.style.marginBottom = '10px';
        hoursContainer.appendChild(input);
    }

    function checkInputStatus(el) {
        let val = el.value.trim();
        el.classList.remove('status-focus', 'status-valid', 'status-error');
        if (val === '') {
            if (document.activeElement === el) el.classList.add('status-focus');
            return;
        }
        let isValid = (el.id === 'notes') ? true : (el.id === 'end_time' ? /^[\d:：]+$/.test(val) : /^\d*\.?\d+$/.test(val));
        el.classList.add(isValid ? 'status-valid' : 'status-error');
    }

    const allInputs = document.querySelectorAll('.input-field');
    allInputs.forEach((input, index) => {
        input.addEventListener('input', () => checkInputStatus(input));
        input.addEventListener('focus', () => checkInputStatus(input));
        input.addEventListener('blur', () => checkInputStatus(input));
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (index < allInputs.length - 1) allInputs[index + 1].focus();
                else this.blur();
            }
        });
    });

    function generateReport() {
        let timeStr = document.getElementById('end_time').value.trim();
        if (/^\d+$/.test(timeStr)) timeStr += ":00";
        timeStr = timeStr.replace("：", ":");

        let totalHours = 0;
        for (let i = 10; i <= 22; i++) {
            let val = parseFloat(document.getElementById('h' + i).value.trim());
            if (!isNaN(val)) totalHours += val;
        }
        
        let qty = parseInt(document.getElementById('qty').value.trim(), 10) || 0;
        let eff = totalHours > 0 ? (qty / totalHours) : 0;

        let d = new Date();
        let today = `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;

        let finalReport = `${today}\n\n截止时间：${timeStr}\n维修数量：${qty}\n维修工时：${totalHours.toFixed(1)}\n维修效率：${eff.toFixed(2)}`;
        let notes = document.getElementById('notes').value.trim();
        if (notes) finalReport += `\n\n分享：\n${notes}`;

        document.getElementById('report-output').innerHTML = finalReport.replace(/\n/g, '<br>');
        document.getElementById('hidden-copy-text').value = finalReport;
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('result-section').scrollIntoView({ behavior: 'smooth' });
    }

    function copyReport() {
        let copyText = document.getElementById('hidden-copy-text');
        copyText.select();
        document.execCommand("copy");
        let btn = document.getElementById('copy-btn');
        btn.innerText = "复制成功！";
        setTimeout(() => { btn.innerText = "点击复制报告内容"; }, 2000);
    }

    function clearData() {
        window.location.reload();
    }
</script>
</body>
</html>
