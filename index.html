<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="维修报告">
    <title>维修报告生成工具</title>
    <style>
        /* --- 全局样式重置 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            margin: 0;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 50px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        hr {
            border: none;
            border-top: 1px solid #d3d3d3;
            margin: 20px 0;
        }
        
        /* --- 标签与输入框样式 --- */
        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #154A7F;
            margin-top: 20px;
            margin-bottom: 8px;
        }
        input, textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 16px; 
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #ffffff;
            appearance: none; 
            -webkit-appearance: none;
            transition: all 0.2s ease;
        }
        textarea {
            height: 120px;
            resize: none;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 1px #4CAF50;
        }
        
        /* 隐藏 number 输入框右侧的上下小箭头 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        /* --- 魔法：填入内容后的绿色状态 --- */
        .is-filled {
            border-color: #4CAF50 !important;
            border-width: 2px !important;
            background-color: #F4FBF4 !important;
        }

        /* --- 按钮样式 --- */
        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            width: 200px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        .btn-primary {
            background-color: #dcf5d0;
            color: #000000;
            font-weight: 900;
            font-size: 22px;
            height: 55px;
        }
        .btn-copy {
            background-color: #f8cbcc;
            color: #000000;
            font-weight: bold;
            font-size: 18px;
            height: 50px;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #888888;
            font-weight: bold;
            font-size: 16px;
            height: 45px;
            border: 1px solid #dddddd;
        }

        /* --- 结果显示区 --- */
        #result-section {
            display: none;
        }
        .report-display {
            font-size: 14px;
            line-height: 1.6;
            color: #000000;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eeeeee;
        }
        #hidden-copy-text {
            position: absolute;
            left: -9999px;
            opacity: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>维修报告生成工具 V1.0</h1>
    <hr style="margin-top: -5px;">

    <!-- 核心修改：截止时间改为 type="number"，并加入 placeholder 灰色提示 -->
    <div class="section-title">截止时间</div>
    <input type="number" id="end_time" class="input-field" placeholder="例如: 22 或者 22:00" enterkeyhint="next">

    <div class="section-title">维修数量</div>
    <input type="number" id="qty" class="input-field" placeholder="请输入数量" enterkeyhint="next">

    <div class="section-title">维修工时</div>
    <div id="hours-container">
        <!-- JS 自动生成 -->
    </div>

    <div class="section-title">其他分享</div>
    <textarea id="notes" class="input-field" placeholder="有什么想分享的吗？"></textarea>

    <!-- 生成按钮 -->
    <div class="btn-container">
        <button class="btn-primary" onclick="generateReport()">生成报告</button>
    </div>

    <!-- 结果区 -->
    <div id="result-section">
        <hr>
        <div id="report-output" class="report-display"></div>
        <hr>
        <textarea id="hidden-copy-text" readonly></textarea>
        <div class="btn-container">
            <button id="copy-btn" class="btn-copy" onclick="copyReport()">点击复制报告内容</button>
        </div>
        <div class="btn-container" style="margin-top: 15px;">
            <button class="btn-secondary" onclick="clearData()">刷新页面</button>
        </div>
    </div>
</div>

<script>
    // 1. 初始化：生成 10 到 22 的工时输入框
    const hoursContainer = document.getElementById('hours-container');
    for (let i = 10; i <= 22; i++) {
        let input = document.createElement('input');
        input.type = 'number';
        input.id = 'h' + i;
        input.className = 'input-field';
        input.enterkeyhint = 'next';
        input.placeholder = i + ':00';
        input.style.marginBottom = '10px';
        hoursContainer.appendChild(input);
    }

    // 2. 魔法：监听所有输入框，变绿 + 回车跳跃
    const allInputs = document.querySelectorAll('.input-field');
    allInputs.forEach((input, index) => {
        input.addEventListener('input', function() {
            if (this.value.trim() !== '') {
                this.classList.add('is-filled');
            } else {
                this.classList.remove('is-filled');
            }
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (this.tagName === 'INPUT') {
                    e.preventDefault(); 
                    if (index < allInputs.length - 1) {
                        allInputs[index + 1].focus(); 
                    } else {
                        this.blur(); 
                    }
                }
            }
        });
    });

    // 3. 生成报告逻辑
    function generateReport() {
        let endTimeInput = document.getElementById('end_time');
        let timeStr = endTimeInput.value.trim();
        if (timeStr) {
            // 自动补全 :00 的逻辑依然保留，只输入 22 也会变成 22:00
            if (/^\d+$/.test(timeStr)) {
                timeStr += ":00";
            }
            timeStr = timeStr.replace("：", ":");
            // 注意：因为 type="number" 的输入框不能直接赋值带冒号的字符串
            // 所以我们只在最终生成的报告里使用格式化后的 timeStr，不强行改变输入框里的值
        }

        let totalHours = 0;
        for (let i = 10; i <= 22; i++) {
            let val = parseFloat(document.getElementById('h' + i).value);
            if (!isNaN(val)) {
                totalHours += val;
            }
        }
        
        let qty = parseInt(document.getElementById('qty').value, 10);
        if (isNaN(qty)) qty = 0;
        
        let eff = totalHours > 0 ? (qty / totalHours) : 0;

        let d = new Date();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        let today = `${month}/${day}`;

        let baseReport = `${today}\n\n截止时间：${timeStr}\n维修工时：${totalHours.toFixed(1)}\n维修效率：${eff.toFixed(2)}`;
        let notes = document.getElementById('notes').value.trim();
        let finalReport = notes ? `${baseReport}\n\n分享：\n${notes}` : baseReport;

        document.getElementById('report-output').innerHTML = finalReport.replace(/\n/g, '<br>');
        document.getElementById('hidden-copy-text').value = finalReport;
        
        let resultSection = document.getElementById('result-section');
        resultSection.style.display = 'block';

        setTimeout(() => {
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }

    // 4. 复制逻辑
    function copyReport() {
        let copyText = document.getElementById('hidden-copy-text');
        copyText.select();
        copyText.setSelectionRange(0, 99999); 
        document.execCommand("copy");

        let btn = document.getElementById('copy-btn');
        let originalText = btn.innerText;
        btn.innerText = "复制成功！";
        btn.style.backgroundColor = "#dcf5d0"; 
        
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "#f8cbcc"; 
        }, 2000);
    }

    // 5. 刷新/清空逻辑
    function clearData() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => {
            allInputs.forEach(input => {
                input.value = '';
                input.classList.remove('is-filled');
            });
            document.getElementById('result-section').style.display = 'none';
        }, 300); 
    }
</script>

</body>
</html>
